<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f3f6fa">
  <meta name="robots" content="noindex, nofollow">
  <title>Выбор раздела · Первые · Кемский округ</title>
  <link rel="icon" href="./favicon.svg" type="image/svg+xml">
  <style>
    * {box-sizing:border-box}
    html {background:#f3f6fa;color:#182b40;font:16px/1.4 system-ui,sans-serif}
    body {margin:0;min-height:100vh;min-height:100svh;display:grid;place-items:center;padding:16px}
    main {width:min(100%,28rem);padding:clamp(18px,5vw,30px);background:white;border:1px solid #dce3ec;border-radius:20px;box-shadow:0 6px 28px #253e5810}
    header {display:flex;align-items:center;gap:14px;margin-bottom:18px}
    header img {width:83px;height:36px;object-fit:contain}
    header span {font-size:.83rem;color:#546579;border-left:1px solid #d1dbe5;padding-left:14px}
    h1 {font-size:clamp(1.35rem,5vw,1.7rem);margin:0 0 14px;line-height:1.2}
    nav {display:grid;gap:9px}
    nav a {min-height:58px;display:grid;grid-template-columns:32px 1fr 10px;align-items:center;gap:12px;padding:10px 14px;text-decoration:none;color:inherit;font-weight:650;border:1px solid #d8e2ea;border-radius:12px}
    nav a:hover {background:#f6f8fb}
    nav a:focus-visible {outline:3px solid #3366cc;outline-offset:2px}
    nav a::after {content:'';width:7px;height:7px;border-top:2px solid #596d80;border-right:2px solid #596d80;transform:rotate(45deg)}
    svg {width:32px;height:32px;padding:5px;border-radius:8px;background:#edf3fc;color:#2759a5;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
    nav a:nth-child(2) svg {background:#fff0f1;color:#b32135}
  </style>
</head>
<body>
  <main aria-labelledby="heading">
    <header><img src="./pervye-logo.svg" alt="Движение Первых"><span>Кемский муниципальный округ</span></header>
    <h1 id="heading">Выберите раздел</h1>
    <nav aria-label="Сайты Кемского округа">
      <a href="./calendar.html#calendar"><svg aria-hidden="true" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M7 3v5m10-5v5M3 11h18m-13 4h3"/></svg><span>Акции и мероприятия</span></a>
      <a href="./planner/guide/?v=open2"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M8 4h8v6a4 4 0 0 1-8 0zM8 6H4v2a4 4 0 0 0 4 4m8-6h4v2a4 4 0 0 1-4 4m-4 2v5m-4 1h8"/></svg><span>Конкурс первичных отделений</span></a>
    </nav>
  </main>
  <script>
    // Preserve bookmarks created before the calendar had its own page.
    function followBookmark() {
      const query = new URLSearchParams(location.search);
      const hash = location.hash;
      if (hash === '#home') return;
      if (hash === '#primary' || query.get('card') === 'primary-contest') {
        location.replace('./planner/guide/?v=open2');
      } else if (['#assignments', '#checklists', '#ded', '#dashboard'].includes(hash)) {
        location.replace('./planner/guide/?v=open2' + hash);
      } else if (query.has('card') || query.has('month') || ['#top','#calendar','#week','#now','#docs','#archive','#projects','#favorites','#updates'].includes(hash)) {
        location.replace('./calendar.html' + location.search + hash);
      }
    }
    followBookmark();
    window.addEventListener('hashchange', followBookmark);
  </script>
</body>
</html>
